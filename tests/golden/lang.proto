// lang.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.lang;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/langpb";

// contract LangGauntlet, version 1, shape 0x5e5a9edad7a67af6.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message SignRequest {
  optional string greeting = 1;  // the vow; unset takes the declared default
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message Signed {
  uint64 instance_id = 1;
  string greeting = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message SessionEvent {
  oneof event {
    Signed signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message ResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// Result<Int, Int>: the contract's own Err is a value, not a
// transport error.
message IntIntResult {
  oneof result {
    int64 ok = 1;
    int64 err = 2;
  }
}

// Result<String, Int>: the contract's own Err is a value, not a
// transport error.
message StringIntResult {
  oneof result {
    string ok = 1;
    int64 err = 2;
  }
}

// Result<Bool, Int>: the contract's own Err is a value, not a
// transport error.
message BoolIntResult {
  oneof result {
    bool ok = 1;
    int64 err = 2;
  }
}

// Option<Int> as a message: an unset value is None.
message IntOption {
  optional int64 value = 1;
}

// The Map<String, Int> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message StringIntMapEntry {
  string key = 1;
  int64 value = 2;
}
message StringIntMap {
  repeated StringIntMapEntry entries = 1;
}

// Result<Map<String, Int>, Int>: the contract's own Err is a value, not a
// transport error.
message StringIntMapIntResult {
  oneof result {
    StringIntMap ok = 1;
    int64 err = 2;
  }
}

// The Tuple<Int, String> as a message, each element a numbered field.
message IntStringTuple {
  int64 item1 = 1;
  string item2 = 2;
}

// Result<Tuple<Int, String>, Int>: the contract's own Err is a value, not a
// transport error.
message IntStringTupleIntResult {
  oneof result {
    IntStringTuple ok = 1;
    int64 err = 2;
  }
}

