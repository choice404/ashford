// The lifecycle states, GEAS_UNSIGNED through GEAS_BROKEN, in the runtime's
// own numbering.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

service LangGauntlet {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(SignRequest) returns (stream SessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(ResumeRequest) returns (stream SessionEvent);
  rpc SumList(SumListRequest) returns (IntIntResult);
  rpc Classify(ClassifyRequest) returns (StringIntResult);
  rpc Fizz(FizzRequest) returns (StringIntResult);
  rpc Find(FindRequest) returns (BoolIntResult);
  rpc Pick(PickRequest) returns (IntIntResult);
  rpc HeadDoubled(HeadDoubledRequest) returns (IntOption);
  rpc Nest(NestRequest) returns (IntIntResult);
  rpc Deep(DeepRequest) returns (IntIntResult);
  rpc Misc(MiscRequest) returns (StringIntResult);
  rpc Guard(GuardRequest) returns (BoolIntResult);
  rpc Orguard(OrguardRequest) returns (BoolIntResult);
  rpc RecCopy(RecCopyRequest) returns (IntIntResult);
  rpc ListCopy(ListCopyRequest) returns (IntIntResult);
  rpc NestedCopy(NestedCopyRequest) returns (IntIntResult);
  rpc MapProbe(MapProbeRequest) returns (IntIntResult);
  rpc MapCopy(MapCopyRequest) returns (IntIntResult);
  rpc TallyCount(TallyCountRequest) returns (IntIntResult);
  rpc MapInt(MapIntRequest) returns (StringIntResult);
  rpc Snapshot(SnapshotRequest) returns (StringIntMapIntResult);
  rpc Tally(TallyRequest) returns (StringIntMapIntResult);
  rpc MergeCounts(MergeCountsRequest) returns (IntIntResult);
  rpc Coords(CoordsRequest) returns (IntStringTupleIntResult);
  rpc BoardWrite(BoardWriteRequest) returns (IntIntResult);
  rpc TallyWrite(TallyWriteRequest) returns (IntIntResult);
  rpc DeepWrite(DeepWriteRequest) returns (IntIntResult);
  rpc Label(LabelRequest) returns (StringIntResult);
  rpc Scale(ScaleRequest) returns (IntIntResult);
  rpc TotalTwice(TotalTwiceRequest) returns (IntIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
